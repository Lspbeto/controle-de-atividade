<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Usuários</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Status Card -->
        <div id="status-card" class="card">
            <h2 id="status-title">Carregando...</h2>
            <p id="status-message">Verificando usuários cadastrados no sistema.</p>
        </div>

        <!-- Registration Form Card -->
        <div id="register-card" class="card hidden">
            <h2 id="form-title">Cadastrar Usuário</h2>
            <form id="user-form">
                <div class="form-group">
                    <label for="username">Nome de Usuário</label>
                    <input type="text" id="username" required placeholder="Digite o nome do usuário">
                </div>
                
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="exemplo@email.com">
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required placeholder="Digite a senha">
                </div>

                <button type="submit" id="submit-btn" class="btn primary">Cadastrar</button>
            </form>
        </div>

        <!-- Registered Users List Card -->
        <div id="users-card" class="card hidden">
            <div class="card-header">
                <h2>Usuários Cadastrados</h2>
                <button id="add-more-btn" class="btn secondary">+ Novo Usuário</button>
            </div>
            <ul id="user-list"></ul>
            <button id="clear-btn" class="btn danger">Limpar Todos os Usuários</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
